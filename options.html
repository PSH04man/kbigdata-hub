<!doctype html>
<meta charset="utf-8">
<title>K-BigData Hub 설정</title>
<style>
  /* 회색 채움 입력칸, 파란 스위치·세그먼트, 하단 꽉 찬 버튼 */
  :root { --bg:#fff; --text:#191f28; --sub:#8b95a1; --body:#4e5968; --fill:#f2f4f6; --line:#e5e8eb; --blue:#3182f6; --blue-d:#1b64da; --seg:#fff; }
  /* 다크: 저장한 테마가 없으면 윈도우 설정을 따른다 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg:#17171c; --text:#e4e4e5; --sub:#7e7e87; --body:#c3c3c6; --fill:#2c2c35; --line:#2c2c35; --seg:#4d4d59; }
  }
  :root[data-theme=dark] { --bg:#17171c; --text:#e4e4e5; --sub:#7e7e87; --body:#c3c3c6; --fill:#2c2c35; --line:#2c2c35; --seg:#4d4d59; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .theme { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); }
  .theme button { width: 28px; height: 24px; border: 0; border-radius: 7px; background: none; color: var(--sub); font-size: 13px; line-height: 1; cursor: pointer; }
  .theme button.on { background: var(--seg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  @font-face { font-family: "Pretendard"; font-weight: 45 920; font-display: swap; src: url(fonts/PretendardVariable.woff2) format("woff2-variations"); }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; } /* 몇 px 넘칠 때 스크롤바가 생기지 않게 (스크롤 자체는 됨) */
  body { width: 360px; margin: 0; padding: 16px 18px 12px; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Pretendard", -apple-system, "Malgun Gothic", sans-serif; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.3px; }
  .desc { color: var(--sub); font-size: 13px; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .label { display: block; color: var(--body); font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  input[type=text], input[type=password] { width: 100%; height: 42px; padding: 0 14px; border: 2px solid transparent;
         border-radius: 12px; background: var(--fill); color: var(--text); font: inherit; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--blue); }
  .pw { position: relative; display: block; }
  .pw input { padding-right: 60px; }
  .peek { position: absolute; right: 6px; top: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: none;
          color: var(--sub); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .peek:hover, .peek:focus-visible { background: var(--line); color: var(--text); outline: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .row b { display: block; font-size: 15px; font-weight: 600; }
  .row + .row { border-top: 0; margin-top: -8px; } /* 이어진 줄은 선 하나만 */
  .row span { color: var(--sub); font-size: 13px; }
  .switch { position: relative; flex: none; width: 50px; height: 30px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background .2s; cursor: pointer; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
         background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked + i { background: var(--blue); }
  .switch input:checked + i::after { transform: translateX(20px); }
  .switch input:focus-visible + i { outline: 2px solid var(--blue); outline-offset: 2px; }
  details { margin-bottom: 8px; }
  summary { color: var(--sub); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 0 10px; }
  .cta { width: 100%; height: 48px; border: 0; border-radius: 16px; background: var(--blue); color: #fff;
         font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s; }
  .cta:hover { background: var(--blue-d); }
  .cta:active { transform: scale(.98); }
  #status { text-align: center; color: var(--blue); font-size: 13px; font-weight: 600; min-height: 18px; margin-top: 4px; }
</style>

<div class="top">
  <h1>K-BigData Hub</h1>
  <div class="theme" role="radiogroup" aria-label="화면 테마">
    <button type="button" role="radio" data-theme="light" title="라이트 모드" aria-label="라이트 모드">☀</button>
    <button type="button" role="radio" data-theme="dark" title="다크 모드" aria-label="다크 모드">☾</button>
  </div>
</div>
<p class="desc">'맞혔어요'를 누르면 내 코드를 GitHub에 올려요.</p>

<div class="field">
  <label class="label" for="token">GitHub 토큰</label>
  <span class="pw"><input id="token" type="password" placeholder="github_pat_…" autocomplete="off"><button type="button" class="peek" data-for="token" aria-label="토큰 보기" aria-pressed="false">보기</button></span>
</div>

<label class="row">
  <div><b>올리기 전에 물어보기</b><span>이름을 확인하고 고칠 수 있어요</span></div>
  <span class="switch"><input id="askFirst" type="checkbox"><i></i></span>
</label>

<label class="row">
  <div><b>문제도 함께 올리기</b><span>README에 문제와 입출력 예제를 넣어요</span></div>
  <span class="switch"><input id="withProblem" type="checkbox"><i></i></span>
</label>

<details>
  <summary>저장소 설정</summary>
  <div class="field"><label class="label" for="repo">저장소</label><input id="repo" type="text" placeholder="아이디/저장소"></div>
  <div class="field"><label class="label" for="branch">브랜치</label><input id="branch" type="text" placeholder="비우면 기본 브랜치"></div>
  <div class="field"><label class="label" for="folder">폴더</label><input id="folder" type="text"></div>
</details>

<button class="cta" id="save">저장하기</button>
<div id="status" role="status"></div>
<script src="lib.js"></script>
<script src="options.js"></script>
